[project]
name = "voice-activity-detection"
version = "1.0.0"
description = "Voice Activity Detection using a 1D ResNet in PyTorch"
authors = [{ name = "Filippo Giruzzi", email = "filippo.giruzzi@gmail.com" }]
readme = "ReadMe.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2,<3.0",
    "torchaudio>=2.2,<3.0",
    "numpy>=1.26,<2.0",
    "librosa>=0.10,<1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "soundfile>=0.12",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "loguru>=0.7",
]

[project.scripts]
vad-data = "vad.data:main"
vad-train = "vad.train:main"
vad-inference = "vad.inference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vad"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
]
ignore = [
    "D100",  # missing docstring in public module (handled at file level)
    "D104",  # missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["vad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
